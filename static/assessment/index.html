<script>
/* Presentation only: questions reveal one at a time (CSS), so bring the next one into view after an answer.
   It reads the DOM that assessment.js renders and never touches its state. */
(function () {
  var app = document.getElementById("app");
  if (!app || !window.matchMedia) return;
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (!t || t.type !== "radio") return;
    var q = t.closest(".as-q");
    if (!q) return;
    var next = q.nextElementSibling;
    while (next && !next.classList.contains("as-q")) next = next.nextElementSibling;
    var target = next && !next.querySelector("input:checked") ? next : app.querySelector(".as-nav");
    if (!target) return;
    requestAnimationFrame(function () {
      var r = target.getBoundingClientRect();
      if (r.top > 96 && r.bottom < window.innerHeight - 24) return;
      target.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: next === target ? "center" : "end" });
    });
  });
})();
</script>
